services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - lutecium-api
    networks:
      - lutecium

  lutecium-api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - lutecium_data:/app/data
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - ./cookies:/app/cookies:ro
    networks:
      - lutecium

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Paris
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
    networks:
      - lutecium

networks:
  lutecium:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  lutecium_data:
